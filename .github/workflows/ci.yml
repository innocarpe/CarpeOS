name: CI

# Lanes (docs/maintainers/ci-policy.md / skills/carpeos-ci):
# - PR lean (parallel, slim): static ∥ monorepo
# - Main full: smokes/evals after monorepo (path-filtered, main only)
# - Aggregate job name "Checks" stays required-check safe
# - Docs/meta-only: path filter → Checks success without monorepo work
#
# Target graph (solo-maintainer):
#   changes → static ∥ monorepo → Checks
#           → main-full (push main only)
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect CI-relevant path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'schemas/**'
              - 'adapters/**'
              - 'fixtures/**'
              - 'artifacts/**'
              - 'spec/**'
              - 'skills/**'
              - '.agents/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'biome.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - 'Makefile'
              - '**/*.{ts,tsx,js,mjs,cjs,cts,mts}'

  # Cheap static gates, one install (format + lint + public-boundary).
  static:
    name: Static
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Public boundary
        run: pnpm public-boundary

  # Heavy monorepo path, one install: build → typecheck → test.
  monorepo:
    name: Monorepo
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Upload build outputs for main-full
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-dist
          path: |
            packages/*/dist
            apps/*/dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  main-full:
    name: Main full
    needs: [changes, monorepo]
    if: >-
      needs.changes.outputs.ci == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: monorepo-dist
          path: .

      - name: Evaluate capture adjudication
        run: pnpm --filter @carpeos/capture eval:adjudication:built

      - name: Evaluate capture knowledge form
        run: pnpm --filter @carpeos/capture eval:knowledge-form:built

      - name: Evaluate retrieval
        run: pnpm --filter @carpeos/retrieval eval:retrieval

      - name: Run synthetic knowledge dogfood smoke
        run: pnpm smoke:dogfood

      - name: Run MCP smoke (G5)
        run: pnpm smoke:mcp

      - name: Run product loop smoke (1.0)
        run: pnpm smoke:product

      - name: Run knowledge adjudication smoke (2.0 MVP)
        run: pnpm smoke:knowledge

      - name: Run sync worker G008 E2E
        run: pnpm --filter @carpeos/sync-worker test:e2e

  # Required status check name stays "Checks" (branch protection / rulesets).
  checks:
    name: Checks
    needs:
      - changes
      - static
      - monorepo
      - main-full
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate PR lean / main-full results
        run: |
          set -euo pipefail

          changes_result="${{ needs.changes.result }}"
          if [ "$changes_result" != "success" ]; then
            echo "Path filter job failed: $changes_result"
            exit 1
          fi

          ci="${{ needs.changes.outputs.ci }}"
          if [ "$ci" != "true" ]; then
            echo "No CI-relevant paths — monorepo jobs skipped; Checks green."
            echo "Gitleaks still runs via secret-scan.yml."
            exit 0
          fi

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "Required job failed: $name result=$result"
              exit 1
            fi
            echo "ok $name"
          }

          require_success "static" "${{ needs.static.result }}"
          require_success "monorepo" "${{ needs.monorepo.result }}"

          main_full_result="${{ needs.main-full.result }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            require_success "main-full" "$main_full_result"
          else
            echo "main-full not required on this event (result=$main_full_result)"
          fi

          echo "All required CI jobs green."
