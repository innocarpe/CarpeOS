name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check
      - name: Evaluate capture adjudication
        run: pnpm --filter @carpeos/capture eval:adjudication

      - name: Evaluate capture knowledge form
        run: pnpm --filter @carpeos/capture eval:knowledge-form

      - name: Build and evaluate retrieval
        run: pnpm --filter @carpeos/retrieval build && pnpm --filter @carpeos/retrieval eval:retrieval

      - name: Run synthetic knowledge dogfood smoke
        run: pnpm smoke:dogfood

      - name: Run MCP smoke (G5)
        run: pnpm smoke:mcp

      - name: Run product loop smoke (1.0)
        run: pnpm smoke:product

      - name: Run knowledge adjudication smoke (2.0 MVP)
        run: pnpm smoke:knowledge

      - name: Run sync worker G008 E2E
        run: pnpm --filter @carpeos/sync-worker test:e2e
