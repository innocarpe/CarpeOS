name: CI

# Lanes (docs/maintainers/ci-policy.md / skills/carpeos-ci):
# - PR lean (parallel): quality | boundary | build → typecheck ∥ test
# - Main full: smokes/evals after lean green (path-filtered)
# - Aggregate job name "Checks" stays required-check safe
# - Docs/meta-only PRs: path filter → Checks success without monorepo work
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "22.22.0"
  PNPM_VERSION: "11.16.0"

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect CI-relevant path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'schemas/**'
              - 'adapters/**'
              - 'fixtures/**'
              - 'artifacts/**'
              - 'spec/**'
              - 'skills/**'
              - '.agents/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'biome.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - 'Makefile'
              - '**/*.{ts,tsx,js,mjs,cjs,cts,mts}'

  quality:
    name: Format & lint
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  boundary:
    name: Public boundary
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Public boundary
        run: pnpm public-boundary

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build monorepo
        run: pnpm build

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-dist
          path: |
            packages/*/dist
            apps/*/dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  typecheck:
    name: Typecheck
    needs: [changes, build]
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: monorepo-dist
          path: .

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    needs: [changes, build]
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: monorepo-dist
          path: .

      - name: Test
        run: pnpm test

  main-full:
    name: Main full
    needs: [changes, build, test]
    if: >-
      needs.changes.outputs.ci == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: monorepo-dist
          path: .

      - name: Evaluate capture adjudication
        run: pnpm --filter @carpeos/capture eval:adjudication:built

      - name: Evaluate capture knowledge form
        run: pnpm --filter @carpeos/capture eval:knowledge-form:built

      - name: Evaluate retrieval
        run: pnpm --filter @carpeos/retrieval eval:retrieval

      - name: Run synthetic knowledge dogfood smoke
        run: pnpm smoke:dogfood

      - name: Run MCP smoke (G5)
        run: pnpm smoke:mcp

      - name: Run product loop smoke (1.0)
        run: pnpm smoke:product

      - name: Run knowledge adjudication smoke (2.0 MVP)
        run: pnpm smoke:knowledge

      - name: Run sync worker G008 E2E
        run: pnpm --filter @carpeos/sync-worker test:e2e

  # Required status check name stays "Checks" (branch protection).
  checks:
    name: Checks
    needs:
      - changes
      - quality
      - boundary
      - build
      - typecheck
      - test
      - main-full
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate PR lean / main-full results
        run: |
          set -euo pipefail

          changes_result="${{ needs.changes.result }}"
          if [ "$changes_result" != "success" ]; then
            echo "Path filter job failed: $changes_result"
            exit 1
          fi

          ci="${{ needs.changes.outputs.ci }}"
          if [ "$ci" != "true" ]; then
            echo "No CI-relevant paths — monorepo jobs skipped; Checks green."
            echo "Gitleaks still runs via secret-scan.yml."
            exit 0
          fi

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "Required job failed: $name result=$result"
              exit 1
            fi
            echo "ok $name"
          }

          require_success "quality" "${{ needs.quality.result }}"
          require_success "boundary" "${{ needs.boundary.result }}"
          require_success "build" "${{ needs.build.result }}"
          require_success "typecheck" "${{ needs.typecheck.result }}"
          require_success "test" "${{ needs.test.result }}"

          # main-full is only required on push to main; skipped elsewhere is OK.
          main_full_result="${{ needs.main-full.result }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            require_success "main-full" "$main_full_result"
          else
            echo "main-full not required on this event (result=$main_full_result)"
          fi

          echo "All required CI jobs green."
