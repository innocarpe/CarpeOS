name: CI

# Lanes (docs/maintainers/ci-policy.md / skills/carpeos-ci):
# - PR lean: format/lint/build/typecheck/test/public-boundary via `pnpm check`
# - Main full: same job continues with evals, smokes, and e2e (no second monorepo rebuild)
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- PR lean (and main) ---
      - name: Run checks
        run: pnpm check

      # --- Main full only: deeper integration (packages already built by pnpm check) ---
      - name: Evaluate capture adjudication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter @carpeos/capture eval:adjudication:built

      - name: Evaluate capture knowledge form
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter @carpeos/capture eval:knowledge-form:built

      - name: Evaluate retrieval
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter @carpeos/retrieval eval:retrieval

      - name: Run synthetic knowledge dogfood smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm smoke:dogfood

      - name: Run MCP smoke (G5)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm smoke:mcp

      - name: Run product loop smoke (1.0)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm smoke:product

      - name: Run knowledge adjudication smoke (2.0 MVP)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm smoke:knowledge

      - name: Run sync worker G008 E2E
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter @carpeos/sync-worker test:e2e
