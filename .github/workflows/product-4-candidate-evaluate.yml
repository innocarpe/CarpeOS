name: Product 4 Candidate Evidence (unprivileged)

# Trust plane (docs/maintainers/ci-policy.md): NOT a PR merge gate until
# ownership/App activation. Live bubblewrap evidence is workflow_dispatch-only
# so PR lean stays at unit/contract + preflight cost.
# Boundary: host prepares tooling/immutable C/disposable mounts only; candidate
# install/build/init/probe run inside bubblewrap.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Full candidate head SHA (40 hex)
        required: true
        type: string
      base_sha:
        description: Full base SHA (40 hex)
        required: true
        type: string

permissions:
  contents: read

jobs:
  raw-evidence:
    name: Produce raw candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Job-level env cannot use the runner context (GitHub rejects runner.temp here).
    env:
      CARPEOS_TRUST_ZONE: tz_synthetic
      PRODUCT4_HEAD_SHA: ${{ inputs.head_sha }}
      PRODUCT4_BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Configure disposable runner paths
        run: |
          {
            echo "CARPEOS_HOME=/var/tmp/carpeos-product4-${GITHUB_RUN_ID}"
            echo "CARPEOS_CANDIDATE_ROOT=/var/tmp/carpeos-product4-candidate-${GITHUB_RUN_ID}"
            echo "CARPEOS_SANDBOX_WORK=/var/tmp/product4-sandbox-work-${GITHUB_RUN_ID}"
            echo "CARPEOS_SANDBOX_CLI=/var/tmp/product4-sandbox-cli-${GITHUB_RUN_ID}"
            echo "CARPEOS_SANDBOX_OUT=/var/tmp/product4-sandbox-out-${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"

      - name: Check out candidate head C
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PRODUCT4_HEAD_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted evaluator base B
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PRODUCT4_BASE_SHA }}
          path: trusted-base
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Install the bubblewrap sandbox runtime
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi

      - name: Execute candidate lifecycle and measured probe inside sandbox
        run: |
          set -euo pipefail
          rm -rf "$CARPEOS_CANDIDATE_ROOT" "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_CLI" "$CARPEOS_HOME" "$CARPEOS_SANDBOX_OUT"
          mv "$GITHUB_WORKSPACE/candidate" "$CARPEOS_CANDIDATE_ROOT"
          pnpm --dir "$CARPEOS_CANDIDATE_ROOT" fetch --frozen-lockfile
          mkdir -p "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_CLI" "$CARPEOS_HOME" "$CARPEOS_SANDBOX_OUT"
          chmod -R a-w "$CARPEOS_CANDIDATE_ROOT"
          chmod 0777 "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_CLI" "$CARPEOS_HOME" "$CARPEOS_SANDBOX_OUT"
          chmod -R a-w "$GITHUB_WORKSPACE/trusted-base"

          head_sha="$PRODUCT4_HEAD_SHA"
          base_sha="$PRODUCT4_BASE_SHA"
          tree_sha256="$(node "$GITHUB_WORKSPACE/trusted-base/scripts/product4/tree-digest.mjs" "$CARPEOS_CANDIDATE_ROOT" HEAD)"
          fixture_sha256="$(cd "$GITHUB_WORKSPACE/trusted-base" && node --input-type=module -e 'import { MAINTENANCE_STUDY_FIXTURE_SHA256 } from "./scripts/product4/policy-identity.mjs"; process.stdout.write(MAINTENANCE_STUDY_FIXTURE_SHA256)')"
          policy_sha256="$(cd "$GITHUB_WORKSPACE/trusted-base" && node --input-type=module -e 'import { PRODUCT4_POLICY_SHA256 } from "./scripts/product4/policy-identity.mjs"; process.stdout.write(PRODUCT4_POLICY_SHA256)')"
          context="$(cd "$GITHUB_WORKSPACE/trusted-base" && node --input-type=module -e 'import { PRODUCT4_CONTEXT } from "./scripts/product4/policy-identity.mjs"; process.stdout.write(PRODUCT4_CONTEXT)')"
          {
            echo "PRODUCT4_TREE_SHA256=$tree_sha256"
            echo "PRODUCT4_FIXTURE_SHA256=$fixture_sha256"
            echo "PRODUCT4_POLICY_SHA256=$policy_sha256"
            echo "PRODUCT4_CONTEXT=$context"
          } >> "$GITHUB_ENV"

          node_path="$(readlink -f "$(command -v node)")"
          node_dir="$(dirname "$node_path")"
          pnpm_command="$(command -v pnpm)"
          pnpm_path="$(readlink -f "$pnpm_command")"
          pnpm_bin_dir="$(dirname "$pnpm_command")"
          pnpm_dir="$(dirname "$(dirname "$pnpm_path")")"
          pnpm_store="$(pnpm store path --silent)"
          test -x "$node_path"
          test -x "$pnpm_path"
          test -d "$pnpm_store"
          test -n "$(find "$pnpm_store" -mindepth 1 -print -quit)"

          sandbox=(
            sudo
            -n
            bwrap
            --die-with-parent
            --new-session
            --unshare-all
            --unshare-net
            --clearenv
            --ro-bind "$CARPEOS_CANDIDATE_ROOT" /candidate
            --bind "$CARPEOS_SANDBOX_WORK" /work
            --bind "$CARPEOS_SANDBOX_CLI" /cli
            --bind "$CARPEOS_HOME" /home
            --bind "$CARPEOS_SANDBOX_OUT" /output
            --tmpfs /tmp
            --proc /proc
            --dev /dev
            --dir /run
            --ro-bind "$GITHUB_WORKSPACE/trusted-base" /trusted-base
            --ro-bind "$pnpm_store" /pnpm-store
            --ro-bind /usr /usr
            --ro-bind /bin /bin
            --ro-bind /lib /lib
            --ro-bind /lib64 /lib64
            --ro-bind /etc /etc
            --ro-bind "$node_dir" "$node_dir"
            --ro-bind "$pnpm_dir" "$pnpm_dir"
            --ro-bind "$pnpm_bin_dir" "$pnpm_bin_dir"
            --chdir /work
            --setenv HOME /home
            --setenv CARPEOS_HOME /home
            --setenv CARPEOS_TRUST_ZONE tz_synthetic
            --setenv NODE_NO_WARNINGS 1
            --setenv NO_COLOR 1
            --setenv TZ UTC
            --setenv PATH "$node_dir:$pnpm_bin_dir:/usr/local/bin:/usr/bin:/bin"
            --setenv PRODUCT4_HEAD_SHA "$head_sha"
            --setenv PRODUCT4_BASE_SHA "$base_sha"
            --setenv PRODUCT4_TREE_SHA256 "$tree_sha256"
            --setenv PRODUCT4_FIXTURE_SHA256 "$fixture_sha256"
            --setenv PRODUCT4_POLICY_SHA256 "$policy_sha256"
            --setenv PRODUCT4_CONTEXT "$context"
            --setenv PRODUCT4_CANDIDATE_ROOT "$CARPEOS_CANDIDATE_ROOT"
            --setenv PRODUCT4_WORKSPACE_ROOT "$CARPEOS_SANDBOX_WORK"
            --setenv PRODUCT4_CLI_ROOT "$CARPEOS_SANDBOX_CLI"
            --setenv PRODUCT4_HOME_ROOT "$CARPEOS_HOME"
            --setenv PRODUCT4_OUTPUT_ROOT "$CARPEOS_SANDBOX_OUT"
            --cap-drop ALL
            --
            setpriv
            --no-new-privs
            --inh-caps=-all
            --ambient-caps=-all
            --
            /bin/bash
            --noprofile
            --norc
            -ceu
            'ulimit -u 64; ulimit -v 1048576; ulimit -f 102400; rm -rf /work/* /cli/*; cp -aL /candidate/. /work/; chmod -R u+rwX /work; cd /work; pnpm install --offline --frozen-store --frozen-lockfile --ignore-scripts --store-dir /pnpm-store; pnpm --filter "@carpeos/cli..." build; node apps/carpeos-cli/dist/index.js init --home /home --trust-zone tz_synthetic; cp -aL /work/. /cli/; node /trusted-base/scripts/product4/sandbox-probe.mjs /output/sandbox-probe.json'
          )
          "${sandbox[@]}"
          sudo -n chown -R "$(id -u):$(id -g)" "$CARPEOS_SANDBOX_OUT"
          sudo -n chmod -R a-w "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_CLI" "$CARPEOS_SANDBOX_OUT"

      - name: Emit sandbox receipt bound to immutable C
        run: |
          set -euo pipefail
          tree_sha256="$(node "$CARPEOS_CANDIDATE_ROOT/scripts/product4/tree-digest.mjs" "$CARPEOS_CANDIDATE_ROOT" HEAD)"
          test "$tree_sha256" = "$PRODUCT4_TREE_SHA256"
          export PROBE_PATH="$CARPEOS_SANDBOX_OUT/sandbox-probe.json"
          export RECEIPT_PATH="$CARPEOS_SANDBOX_OUT/sandbox-receipt.json"
          export CANDIDATE_ROOT="$CARPEOS_CANDIDATE_ROOT"
          export WORKSPACE_ROOT="$CARPEOS_SANDBOX_WORK"
          export CLI_ROOT="$CARPEOS_SANDBOX_CLI"
          export HOME_ROOT="$CARPEOS_HOME"
          export OUTPUT_ROOT="$CARPEOS_SANDBOX_OUT"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { assertSandboxProbeObservation, buildP02SandboxReceipt } from "./trusted-base/scripts/product4/p02-runner.mjs";
          const observedProbe = JSON.parse(readFileSync(process.env.PROBE_PATH, "utf8"));
          assertSandboxProbeObservation(observedProbe);
          const receipt = buildP02SandboxReceipt({
            candidateRoot: process.env.CANDIDATE_ROOT,
            workspaceRoot: process.env.WORKSPACE_ROOT,
            cliRoot: process.env.CLI_ROOT,
            home: process.env.HOME_ROOT,
            output: process.env.OUTPUT_ROOT,
            headSha: process.env.PRODUCT4_HEAD_SHA,
            baseSha: process.env.PRODUCT4_BASE_SHA,
            treeSha256: process.env.PRODUCT4_TREE_SHA256,
            fixtureSha256: process.env.PRODUCT4_FIXTURE_SHA256,
            policySha256: process.env.PRODUCT4_POLICY_SHA256,
            context: process.env.PRODUCT4_CONTEXT,
            observedProbe,
          });
          writeFileSync(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`, { encoding: "utf8", mode: 0o400 });
          NODE
          sudo -n chmod -R a-w "$CARPEOS_SANDBOX_OUT"

      - name: Replay the exact read-only P02 command twice
        run: |
          mkdir -p "$RUNNER_TEMP/product4-artifacts"
          NODE_NO_WARNINGS=1 node "$GITHUB_WORKSPACE/trusted-base/scripts/product4/p02-runner.mjs" \
            --home "$CARPEOS_HOME" \
            --workspace-root "$CARPEOS_SANDBOX_WORK" \
            --cli-root "$CARPEOS_SANDBOX_CLI" \
            --candidate-root "$CARPEOS_CANDIDATE_ROOT" \
            --sandbox-receipt "$CARPEOS_SANDBOX_OUT/sandbox-receipt.json" \
            --output "$RUNNER_TEMP/product4-artifacts/p02-receipt.json"
          tree_sha256="$(node "$GITHUB_WORKSPACE/trusted-base/scripts/product4/tree-digest.mjs" "$CARPEOS_CANDIDATE_ROOT" HEAD)"
          node "$GITHUB_WORKSPACE/trusted-base/scripts/product4/raw-producer.mjs" \
            --p02 "$RUNNER_TEMP/product4-artifacts/p02-receipt.json" \
            --head-sha "$PRODUCT4_HEAD_SHA" \
            --base-sha "$PRODUCT4_BASE_SHA" \
            --tree-sha256 "$tree_sha256" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --output "$RUNNER_TEMP/product4-artifacts/raw-report.json"

      - name: Upload raw evidence as untrusted data
        uses: actions/upload-artifact@v6
        with:
          name: product4-raw-${{ env.PRODUCT4_HEAD_SHA }}
          path: ${{ runner.temp }}/product4-artifacts/raw-report.json
          if-no-files-found: error
          retention-days: 7
