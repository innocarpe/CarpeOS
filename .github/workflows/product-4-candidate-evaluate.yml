name: Product 4 Candidate Evidence (unprivileged)

# Trust plane (docs/maintainers/ci-policy.md): not a default PR required gate until
# ownership/App activation. Auto-run only when Product 4 trust-plane paths change.
# Unit/contract tests remain the PR quality gate for Product 4 logic on other PRs.
#
# Boundary: host steps only prepare trusted tooling, immutable candidate input, a
# disposable mount layout, and an offline package store. Candidate install, build,
# CLI init, and probe execution run only inside a bounded bubblewrap namespace.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/product4/**"
      - "scripts/test/product4-*.test.mjs"
      - "schemas/product4*.json"
      - "spec/product4/**"
      - ".github/workflows/product-4-candidate-*.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  raw-evidence:
    name: Produce raw candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    # Job-level env cannot use the runner context (GitHub rejects runner.temp here).
    env:
      CARPEOS_TRUST_ZONE: tz_synthetic
    steps:
      - name: Configure disposable runner paths
        run: |
          {
            echo "CARPEOS_HOME=/tmp/carpeos-product4-${GITHUB_RUN_ID}"
            echo "CARPEOS_CANDIDATE_ROOT=/tmp/carpeos-product4-candidate-${GITHUB_RUN_ID}"
            echo "CARPEOS_SANDBOX_WORK=/tmp/product4-sandbox-work-${GITHUB_RUN_ID}"
            echo "CARPEOS_SANDBOX_OUT=/tmp/product4-sandbox-out-${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"

      - name: Check out candidate head C into an isolated workspace
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Move C into an external candidate root
        run: |
          rm -rf "$CARPEOS_CANDIDATE_ROOT"
          mv "$GITHUB_WORKSPACE/candidate" "$CARPEOS_CANDIDATE_ROOT"
          mkdir -p "$CARPEOS_HOME" "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_OUT"
          chmod 0777 "$CARPEOS_HOME" "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_OUT"

      - name: Populate the offline package store without candidate lifecycle
        # `pnpm fetch` only downloads into the host store. It does not install into
        # the candidate tree, run package scripts, build, or initialize the CLI.
        run: pnpm --dir "$CARPEOS_CANDIDATE_ROOT" fetch --frozen-lockfile

      - name: Freeze the immutable candidate root before sandbox execution
        run: chmod -R a-w "$CARPEOS_CANDIDATE_ROOT"

      - name: Install the bubblewrap sandbox runtime
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi

      - name: Execute candidate install build and CLI only inside bubblewrap
        run: |
          set -euo pipefail
          # setup-pnpm install prefix is not bindable under `sudo bwrap` on GHA
          # ("Permission denied" on the action tool bin dir). Stage a self-contained
          # node+pnpm prefix and a copy of the offline store under /var/tmp
          # (not /tmp: sandbox uses --tmpfs /tmp).
          tool_root="/var/tmp/product4-host-tools-${GITHUB_RUN_ID}"
          staged_store="/var/tmp/product4-pnpm-store-${GITHUB_RUN_ID}"
          rm -rf "$tool_root" "$staged_store"
          mkdir -p "$tool_root/bin" "$staged_store"
          node_src="$(readlink -f "$(command -v node)")"
          node_dir="$(dirname "$node_src")"
          cp -a "$node_src" "$tool_root/bin/node"
          if [[ -x "$node_dir/npm" ]]; then
            npm_cmd="$node_dir/npm"
          else
            npm_cmd="$(command -v npm)"
          fi
          "$npm_cmd" install --global --prefix "$tool_root" pnpm@11.16.0
          host_store="$(pnpm store path --silent)"
          test -d "$host_store"
          test -n "$(find "$host_store" -mindepth 1 -print -quit)"
          # Full copy into a disposable tree with world rwx so the sandbox user
          # can open/update pnpm's store SQLite index.
          cp -a "$host_store"/. "$staged_store"/
          chmod -R a+rwX "$tool_root" "$staged_store"
          test -x "$tool_root/bin/node"
          test -x "$tool_root/bin/pnpm"
          test -d "$staged_store"
          test -n "$(find "$staged_store" -mindepth 1 -print -quit)"
          sandbox=(
            sudo
            -n
            bwrap
            --die-with-parent
            --new-session
            --unshare-all
            --unshare-net
            --clearenv
            --ro-bind "$CARPEOS_CANDIDATE_ROOT" /candidate
            --bind "$CARPEOS_SANDBOX_WORK" /work
            --bind "$CARPEOS_HOME" /home
            --bind "$CARPEOS_SANDBOX_OUT" /output
            --tmpfs /tmp
            --proc /proc
            --dev /dev
            --dir /run
            --chdir /work
            --setenv HOME /home
            --setenv CARPEOS_HOME /home
            --setenv CARPEOS_TRUST_ZONE tz_synthetic
            --setenv NODE_NO_WARNINGS 1
            --setenv NO_COLOR 1
            --setenv TZ UTC
            # --clearenv strips host CI; pnpm aborts modules purge without TTY unless CI=true.
            --setenv CI true
            --setenv PATH "$tool_root/bin:/usr/local/bin:/usr/bin:/bin"
            --cap-drop ALL
            --ro-bind /usr /usr
            --ro-bind /bin /bin
            --ro-bind /lib /lib
            --ro-bind /lib64 /lib64
            --ro-bind /etc /etc
            --ro-bind "$tool_root" "$tool_root"
            --bind "$staged_store" /pnpm-store
            --
            setpriv
            --no-new-privs
            --inh-caps=-all
            --ambient-caps=-all
            --
          )
          # Process/memory match the sandbox contract for the probe. Install/build
          # run under the same rlimits; do not set a low file-size ulimit.
          # Apply rlimits inside the sandbox (sudo resets host ulimit).
          "${sandbox[@]}" /bin/bash --noprofile --norc -ceu '
            ulimit -u 64
            ulimit -v 1048576
            rm -rf /work/*
            cp -RL --no-preserve=ownership /candidate/. /work/
            find /work -mindepth 1 -exec chmod u+rwX {} +
            cd /work
            # Offline + frozen lockfile. Avoid --frozen-store (ReadOnlyStoreIndex fails
            # to open index.db under this mount).
            pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir /pnpm-store --config.confirmModulesPurge=false
            pnpm --filter "@carpeos/cli..." build
            node apps/carpeos-cli/dist/index.js init --home /home --trust-zone tz_synthetic
            # Observed probe (not claim-only static JSON).
            node /work/scripts/product4/sandbox-probe.mjs /output/sandbox-probe.json
          '
          # sudo bwrap writes as root; reclaim for unprivileged host validation.
          sudo -n chown -R "$(id -u):$(id -g)" "$CARPEOS_SANDBOX_OUT" "$CARPEOS_SANDBOX_WORK" "$CARPEOS_HOME"
          sudo -n chmod -R a-w "$CARPEOS_SANDBOX_WORK"
          sudo -n chmod -R a-w "$CARPEOS_HOME"

      - name: Emit sandbox receipt bound to immutable C
        run: |
          set -euo pipefail
          tree_sha256="$(node "$CARPEOS_CANDIDATE_ROOT/scripts/product4/tree-digest.mjs" "$CARPEOS_CANDIDATE_ROOT" HEAD)"
          export RECEIPT_PATH="$CARPEOS_SANDBOX_OUT/sandbox-receipt.json"
          export HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          export BASE_SHA="${{ github.event.pull_request.base.sha }}"
          export TREE_SHA256="$tree_sha256"
          export PROBE_PATH="$CARPEOS_SANDBOX_OUT/sandbox-probe.json"
          export CANDIDATE_ROOT="$CARPEOS_CANDIDATE_ROOT"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          import { resolve } from "node:path";

          const runnerUrl = pathToFileURL(
            resolve(process.env.CANDIDATE_ROOT, "scripts/product4/p02-runner.mjs"),
          ).href;
          const {
            assertSandboxProbeObservation,
            buildP02SandboxReceipt,
            sandboxProbeDigest,
          } = await import(runnerUrl);
          const probe = assertSandboxProbeObservation(
            JSON.parse(readFileSync(process.env.PROBE_PATH, "utf8")),
          );
          const receipt = buildP02SandboxReceipt({
            candidateRoot: process.env.CANDIDATE_ROOT,
            headSha: process.env.HEAD_SHA,
            baseSha: process.env.BASE_SHA,
            treeSha256: process.env.TREE_SHA256,
            probe,
            probeSha256: sandboxProbeDigest(probe),
          });
          writeFileSync(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o400,
          });
          NODE
          sudo -n chmod -R a-w "$CARPEOS_SANDBOX_OUT"

      - name: Replay the exact read-only P02 command twice
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/product4-artifacts"
          # Re-open home for the unprivileged raw producer seed writes.
          sudo -n chmod -R a+rwX "$CARPEOS_HOME"
          NODE_NO_WARNINGS=1 node "$CARPEOS_CANDIDATE_ROOT/scripts/product4/p02-runner.mjs" \
            --home "$CARPEOS_HOME" \
            --workspace-root "$CARPEOS_SANDBOX_WORK" \
            --cli-root "$CARPEOS_SANDBOX_WORK" \
            --candidate-root "$CARPEOS_CANDIDATE_ROOT" \
            --sandbox-receipt "$CARPEOS_SANDBOX_OUT/sandbox-receipt.json" \
            --output "$RUNNER_TEMP/product4-artifacts/p02-receipt.json"
          tree_sha256="$(node "$CARPEOS_CANDIDATE_ROOT/scripts/product4/tree-digest.mjs" "$CARPEOS_CANDIDATE_ROOT" HEAD)"
          node "$CARPEOS_CANDIDATE_ROOT/scripts/product4/raw-producer.mjs" \
            --p02 "$RUNNER_TEMP/product4-artifacts/p02-receipt.json" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --tree-sha256 "$tree_sha256" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --output "$RUNNER_TEMP/product4-artifacts/raw-report.json"

      - name: Upload raw evidence as untrusted data
        uses: actions/upload-artifact@v6
        with:
          name: product4-raw-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/product4-artifacts/raw-report.json
          if-no-files-found: error
          retention-days: 7
