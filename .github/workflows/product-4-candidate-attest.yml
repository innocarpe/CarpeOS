name: Product 4 Candidate Attestation (base-owned)

# The evaluate workflow is dispatch-only until trust-plane activation. This
# workflow therefore chains only successful workflow_dispatch evaluate runs,
# while workflow_dispatch provides an explicit replay path with the same
# upstream identity fields.
on:
  workflow_run:
    workflows:
      - Product 4 Candidate Evidence (unprivileged)
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact successful evaluate workflow run ID
        required: true
        type: string
      head_sha:
        description: Exact upstream candidate head SHA (40 hex)
        required: true
        type: string
      base_sha:
        description: Exact upstream trusted base SHA (40 hex)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  attest:
    name: Recompute trusted Product 4 evidence
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    # Job-level env cannot use the runner context (GitHub rejects runner.temp here).
    env:
      CARPEOS_TRUST_ZONE: tz_synthetic
    steps:
      - name: Configure disposable runner paths
        run: |
          {
            echo "CARPEOS_HOME=/var/tmp/carpeos-product4-evaluator-${GITHUB_RUN_ID}"
            echo "CARPEOS_CANDIDATE_ROOT=/var/tmp/carpeos-product4-candidate-${GITHUB_RUN_ID}"
            echo "CARPEOS_SANDBOX_WORK=/var/tmp/product4-sandbox-work-${GITHUB_RUN_ID}"
            echo "CARPEOS_SANDBOX_CLI=/var/tmp/product4-sandbox-cli-${GITHUB_RUN_ID}"
            echo "CARPEOS_SANDBOX_OUT=/var/tmp/product4-sandbox-out-${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"

      - name: Normalize upstream evaluate identity
        id: normalize
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          EVENT_EVENT: ${{ github.event.workflow_run.event }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1" >&2
            exit 1
          }
          sha_re='^[0-9a-f]{40}$'
          run_re='^[1-9][0-9]*$'
          repository="$GITHUB_REPOSITORY"
          [ -n "$repository" ] || fail "current repository is missing"
          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              run_id="${EVENT_RUN_ID:-}"
              head_sha="${EVENT_HEAD_SHA:-}"
              event_repository="${EVENT_REPOSITORY:-}"
              event_name="${EVENT_EVENT:-}"
              event_conclusion="${EVENT_CONCLUSION:-}"
              [ "$event_repository" = "$repository" ] ||
                fail "workflow_run repository is not the current repository"
              [ "$event_name" = "workflow_dispatch" ] ||
                fail "upstream evaluate event is not workflow_dispatch"
              [ "$event_conclusion" = "success" ] ||
                fail "upstream evaluate conclusion is not success"
              # workflow_run does not carry workflow_dispatch inputs. The raw
              # report supplies base_sha and is bound before either checkout.
              base_sha=""
              ;;
            workflow_dispatch)
              run_id="${INPUT_RUN_ID:-}"
              head_sha="${INPUT_HEAD_SHA:-}"
              base_sha="${INPUT_BASE_SHA:-}"
              ;;
            *)
              fail "unsupported attestation event: $GITHUB_EVENT_NAME"
              ;;
          esac
          [[ "$run_id" =~ $run_re ]] || fail "upstream run_id is malformed"
          [[ "$head_sha" =~ $sha_re ]] || fail "upstream head_sha is malformed"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$base_sha" =~ $sha_re ]] || fail "upstream base_sha is malformed"
          fi
          {
            echo "PRODUCT4_UPSTREAM_RUN_ID=$run_id"
            echo "PRODUCT4_UPSTREAM_HEAD_SHA=$head_sha"
            echo "PRODUCT4_UPSTREAM_BASE_SHA=$base_sha"
            echo "PRODUCT4_UPSTREAM_REPOSITORY=$repository"
          } >> "$GITHUB_ENV"
          {
            echo "run_id=$run_id"
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "repository=$repository"
          } >> "$GITHUB_OUTPUT"

      - name: Verify upstream evaluate run metadata before artifact access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1" >&2
            exit 1
          }
          [ -n "${GH_TOKEN:-}" ] || fail "GitHub token is missing for metadata verification"
          metadata="$RUNNER_TEMP/product4-upstream-run.json"
          curl --fail --silent --show-error --request GET \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$PRODUCT4_UPSTREAM_REPOSITORY/actions/runs/$PRODUCT4_UPSTREAM_RUN_ID" \
            --output "$metadata"
          jq -e \
            --arg repository "$PRODUCT4_UPSTREAM_REPOSITORY" \
            --arg workflow "Product 4 Candidate Evidence (unprivileged)" \
            --arg event "workflow_dispatch" \
            --arg run_id "$PRODUCT4_UPSTREAM_RUN_ID" \
            --arg head_sha "$PRODUCT4_UPSTREAM_HEAD_SHA" \
            'type == "object" and
             (.id | tostring) == $run_id and
             .repository.full_name == $repository and
             .name == $workflow and
             .status == "completed" and
             .conclusion == "success" and
             .event == $event and
             .head_sha == $head_sha' "$metadata" >/dev/null ||
            fail "upstream evaluate run metadata is missing or mismatched"

      - name: Download exact raw evidence from the verified run
        uses: actions/download-artifact@v7
        with:
          name: product4-raw-${{ steps.normalize.outputs.head_sha }}
          path: ${{ runner.temp }}/product4-raw
          github-token: ${{ github.token }}
          repository: ${{ steps.normalize.outputs.repository }}
          run-id: ${{ steps.normalize.outputs.run_id }}

      - name: Bind raw report C/base to normalized upstream identity
        id: bind
        env:
          NORMALIZED_BASE_SHA: ${{ steps.normalize.outputs.base_sha }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1" >&2
            exit 1
          }
          report="$RUNNER_TEMP/product4-raw/raw-report.json"
          [ -s "$report" ] || fail "raw report is missing"
          report_head="$(jq -er '.head_sha | select(type == "string")' "$report")" ||
            fail "raw report head_sha is missing or malformed"
          report_base="$(jq -er '.base_sha | select(type == "string")' "$report")" ||
            fail "raw report base_sha is missing or malformed"
          sha_re='^[0-9a-f]{40}$'
          [[ "$report_head" =~ $sha_re ]] || fail "raw report head_sha is malformed"
          [[ "$report_base" =~ $sha_re ]] || fail "raw report base_sha is malformed"
          [ "$report_head" = "$PRODUCT4_UPSTREAM_HEAD_SHA" ] ||
            fail "raw report head_sha is not bound to upstream C"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            expected_base="$NORMALIZED_BASE_SHA"
          else
            expected_base="$report_base"
          fi
          [[ "$expected_base" =~ $sha_re ]] ||
            fail "normalized upstream base_sha is missing or malformed"
          [ "$report_base" = "$expected_base" ] ||
            fail "raw report base_sha is not bound to upstream B"
          {
            echo "PRODUCT4_UPSTREAM_BASE_SHA=$expected_base"
            echo "PRODUCT4_HEAD_SHA=$PRODUCT4_UPSTREAM_HEAD_SHA"
            echo "PRODUCT4_BASE_SHA=$expected_base"
          } >> "$GITHUB_ENV"
          {
            echo "run_id=$PRODUCT4_UPSTREAM_RUN_ID"
            echo "head_sha=$PRODUCT4_UPSTREAM_HEAD_SHA"
            echo "base_sha=$expected_base"
            echo "repository=$PRODUCT4_UPSTREAM_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

      - name: Check out trusted evaluator base B
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.bind.outputs.repository }}
          ref: ${{ steps.bind.outputs.base_sha }}
          persist-credentials: false

      - name: Check out C only into an isolated no-secret workspace
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.bind.outputs.repository }}
          ref: ${{ steps.bind.outputs.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Move C into an external candidate workspace
        run: |
          rm -rf "$CARPEOS_CANDIDATE_ROOT"
          mv "$GITHUB_WORKSPACE/candidate" "$CARPEOS_CANDIDATE_ROOT"
          mkdir -p "$CARPEOS_HOME" "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_CLI" "$CARPEOS_SANDBOX_OUT"
          chmod 0777 "$CARPEOS_HOME" "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_CLI" "$CARPEOS_SANDBOX_OUT"
      - name: Populate the offline package store without candidate lifecycle
        run: pnpm --dir "$CARPEOS_CANDIDATE_ROOT" fetch --frozen-lockfile

      - name: Freeze trusted evaluator and raw inputs before candidate execution
        run: |
          chmod -R a-w "$GITHUB_WORKSPACE"
          chmod -R a-w "$RUNNER_TEMP/product4-raw"
          chmod -R a-w "$CARPEOS_CANDIDATE_ROOT"

      - name: Install the bubblewrap sandbox runtime
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi

      - name: Execute candidate build and CLI in a bounded bubblewrap sandbox
        run: |
          set -euo pipefail
          tree_sha256="$(node "$GITHUB_WORKSPACE/scripts/product4/tree-digest.mjs" "$CARPEOS_CANDIDATE_ROOT" HEAD)"
          head_sha="$PRODUCT4_HEAD_SHA"
          base_sha="$PRODUCT4_BASE_SHA"
          fixture_sha256="$(node --input-type=module -e 'import { MAINTENANCE_STUDY_FIXTURE_SHA256 } from "./scripts/product4/policy-identity.mjs"; process.stdout.write(MAINTENANCE_STUDY_FIXTURE_SHA256)')"
          policy_sha256="$(node --input-type=module -e 'import { PRODUCT4_POLICY_SHA256 } from "./scripts/product4/policy-identity.mjs"; process.stdout.write(PRODUCT4_POLICY_SHA256)')"
          context="$(node --input-type=module -e 'import { PRODUCT4_CONTEXT } from "./scripts/product4/policy-identity.mjs"; process.stdout.write(PRODUCT4_CONTEXT)')"
          {
            echo "PRODUCT4_HEAD_SHA=$head_sha"
            echo "PRODUCT4_TREE_SHA256=$tree_sha256"
            echo "PRODUCT4_FIXTURE_SHA256=$fixture_sha256"
            echo "PRODUCT4_POLICY_SHA256=$policy_sha256"
            echo "PRODUCT4_CONTEXT=$context"
          } >> "$GITHUB_ENV"

          node_path="$(readlink -f "$(command -v node)")"
          node_dir="$(dirname "$node_path")"
          pnpm_command="$(command -v pnpm)"
          pnpm_path="$(readlink -f "$pnpm_command")"
          pnpm_bin_dir="$(dirname "$pnpm_command")"
          pnpm_dir="$(dirname "$(dirname "$pnpm_path")")"
          pnpm_store="$(pnpm store path --silent)"
          test -x "$node_path"
          test -x "$pnpm_path"
          test -d "$pnpm_store"
          test -n "$(find "$pnpm_store" -mindepth 1 -print -quit)"
          mkdir -p "$CARPEOS_SANDBOX_CLI"
          sandbox=(
            sudo
            -n
            bwrap
            --die-with-parent
            --new-session
            --unshare-all
            --unshare-net
            --clearenv
            --ro-bind "$CARPEOS_CANDIDATE_ROOT" /candidate
            --ro-bind "$CARPEOS_CANDIDATE_ROOT" "$CARPEOS_CANDIDATE_ROOT"
            --bind "$CARPEOS_SANDBOX_WORK" /work
            --bind "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_WORK"
            --bind "$CARPEOS_SANDBOX_CLI" /cli
            --bind "$CARPEOS_SANDBOX_CLI" "$CARPEOS_SANDBOX_CLI"
            --bind "$CARPEOS_HOME" /home
            --bind "$CARPEOS_HOME" "$CARPEOS_HOME"
            --bind "$CARPEOS_SANDBOX_OUT" /output
            --bind "$CARPEOS_SANDBOX_OUT" "$CARPEOS_SANDBOX_OUT"
            --tmpfs /tmp
            --proc /proc
            --dev /dev
            --dir /run
            --ro-bind "$GITHUB_WORKSPACE" /trusted-base
            --chdir /work
            --setenv HOME /home
            --setenv CARPEOS_HOME /home
            --setenv CARPEOS_TRUST_ZONE tz_synthetic
            --setenv NODE_NO_WARNINGS 1
            --setenv NO_COLOR 1
            --setenv TZ UTC
            --setenv PATH "$node_dir:$pnpm_bin_dir:/usr/local/bin:/usr/bin:/bin"
            --setenv PRODUCT4_HEAD_SHA "$head_sha"
            --setenv PRODUCT4_BASE_SHA "$base_sha"
            --setenv PRODUCT4_TREE_SHA256 "$tree_sha256"
            --setenv PRODUCT4_FIXTURE_SHA256 "$fixture_sha256"
            --setenv PRODUCT4_POLICY_SHA256 "$policy_sha256"
            --setenv PRODUCT4_CONTEXT "$context"
            --setenv PRODUCT4_CANDIDATE_ROOT "$CARPEOS_CANDIDATE_ROOT"
            --setenv PRODUCT4_WORKSPACE_ROOT "$CARPEOS_SANDBOX_WORK"
            --setenv PRODUCT4_CLI_ROOT "$CARPEOS_SANDBOX_CLI"
            --setenv PRODUCT4_HOME_ROOT "$CARPEOS_HOME"
            --setenv PRODUCT4_OUTPUT_ROOT "$CARPEOS_SANDBOX_OUT"
            --cap-drop ALL
            --ro-bind /usr /usr
            --ro-bind /bin /bin
            --ro-bind /lib /lib
            --ro-bind /lib64 /lib64
            --ro-bind /etc /etc
            --ro-bind "$node_dir" "$node_dir"
            --ro-bind "$pnpm_dir" "$pnpm_dir"
            --ro-bind "$pnpm_bin_dir" "$pnpm_bin_dir"
            --ro-bind "$pnpm_store" /pnpm-store
            --
            setpriv
            --no-new-privs
            --inh-caps=-all
            --ambient-caps=-all
            --
          )
          # rlimits must be set inside the namespace (after setpriv). Host ulimit
          # before sudo bwrap is reset by sudo and is not observed by the probe.
          # --noprofile/--norc: bash -u must not source /etc/bash.bashrc (PS1).
          "${sandbox[@]}" /bin/bash --noprofile --norc -ceu '
            ulimit -u 64
            ulimit -v 1048576
            ulimit -f 102400
            rm -rf /work/* /cli/*
            cp -RL --no-preserve=ownership /candidate/. /work/
            find /work -mindepth 1 -exec chmod u+rwX {} +
            cd /work
            pnpm install --offline --frozen-store --frozen-lockfile --ignore-scripts --store-dir /pnpm-store
            pnpm --filter "@carpeos/cli..." build
            node apps/carpeos-cli/dist/index.js init --home /home --trust-zone tz_synthetic
            # Replays use a distinct immutable CLI root; this copy is made inside
            # the namespace so no candidate build output crosses the host.
            cp -RL --no-preserve=ownership /work/. /cli/
            node /trusted-base/scripts/product4/sandbox-probe.mjs /output/sandbox-probe.json
          '
          sudo -n chmod -R a-w "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_CLI"
          # sudo bwrap writes probe as root (mode 0600). Hand ownership back so
          # the unprivileged host job can validate and seal the receipt.
          sudo -n chown -R "$(id -u):$(id -g)" "$CARPEOS_SANDBOX_OUT"

      - name: Emit trusted sandbox receipt
        run: |
          set -euo pipefail
          export PROBE_PATH="$CARPEOS_SANDBOX_OUT/sandbox-probe.json"
          export RECEIPT_PATH="$CARPEOS_SANDBOX_OUT/sandbox-receipt.json"
          export CANDIDATE_ROOT="$CARPEOS_CANDIDATE_ROOT"
          export WORKSPACE_ROOT="$CARPEOS_SANDBOX_WORK"
          export CLI_ROOT="$CARPEOS_SANDBOX_CLI"
          export HOME_ROOT="$CARPEOS_HOME"
          export OUTPUT_ROOT="$CARPEOS_SANDBOX_OUT"
          tree_sha256="$(node "$GITHUB_WORKSPACE/scripts/product4/tree-digest.mjs" "$CARPEOS_CANDIDATE_ROOT" HEAD)"
          test "$tree_sha256" = "$PRODUCT4_TREE_SHA256"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import {
            assertSandboxProbeObservation,
            buildP02SandboxReceipt,
          } from "./scripts/product4/p02-runner.mjs";

          const observedProbe = assertSandboxProbeObservation(
            JSON.parse(readFileSync(process.env.PROBE_PATH, "utf8")),
          );
          const receipt = buildP02SandboxReceipt({
            candidateRoot: process.env.CANDIDATE_ROOT,
            workspaceRoot: process.env.WORKSPACE_ROOT,
            cliRoot: process.env.CLI_ROOT,
            home: process.env.HOME_ROOT,
            output: process.env.OUTPUT_ROOT,
            headSha: process.env.PRODUCT4_HEAD_SHA,
            baseSha: process.env.PRODUCT4_BASE_SHA,
            treeSha256: process.env.PRODUCT4_TREE_SHA256,
            fixtureSha256: process.env.PRODUCT4_FIXTURE_SHA256,
            policySha256: process.env.PRODUCT4_POLICY_SHA256,
            context: process.env.PRODUCT4_CONTEXT,
            observedProbe,
          });
          writeFileSync(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o400,
          });
          NODE
          sudo -n chmod -R a-w "$CARPEOS_SANDBOX_OUT"

      - name: Recompute C-bound semantics from the trusted base
        run: |
          rm -rf "$RUNNER_TEMP/product4-attestation-out"
          mkdir -m 700 "$RUNNER_TEMP/product4-attestation-out"
          tree_sha256="$(node "$GITHUB_WORKSPACE/scripts/product4/tree-digest.mjs" "$CARPEOS_CANDIDATE_ROOT" HEAD)"
          NODE_NO_WARNINGS=1 node "$GITHUB_WORKSPACE/scripts/product4/evaluator-runner.mjs" \
            --raw-report "$RUNNER_TEMP/product4-raw/raw-report.json" \
            --candidate-root "$CARPEOS_CANDIDATE_ROOT" \
            --workspace-root "$CARPEOS_SANDBOX_WORK" \
            --cli-root "$CARPEOS_SANDBOX_CLI" \
            --home "$CARPEOS_HOME" \
            --sandbox-receipt "$CARPEOS_SANDBOX_OUT/sandbox-receipt.json" \
            --head-sha "$PRODUCT4_HEAD_SHA" \
            --base-sha "$PRODUCT4_BASE_SHA" \
            --tree-sha256 "$tree_sha256" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --output "$RUNNER_TEMP/product4-attestation-out/attestation.json"

      - name: Upload strict attestation data
        uses: actions/upload-artifact@v6
        with:
          name: product4-attestation
          path: ${{ runner.temp }}/product4-attestation-out/attestation.json
          if-no-files-found: error
          retention-days: 7
