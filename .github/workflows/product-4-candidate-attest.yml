name: Product 4 Candidate Attestation (base-owned)

on:
  workflow_run:
    workflows:
      - Product 4 Candidate Evidence (unprivileged)
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  attest:
    name: Recompute trusted Product 4 evidence
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    # Job-level env cannot use the runner context (GitHub rejects runner.temp here).
    env:
      CARPEOS_TRUST_ZONE: tz_synthetic
      PRODUCT4_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
    steps:
      - name: Configure disposable runner paths
        run: |
          {
            echo "CARPEOS_HOME=/tmp/carpeos-product4-evaluator-${GITHUB_RUN_ID}"
            echo "CARPEOS_CANDIDATE_ROOT=/tmp/carpeos-product4-candidate-${GITHUB_RUN_ID}"
            echo "CARPEOS_SANDBOX_WORK=/tmp/product4-sandbox-work-${GITHUB_RUN_ID}"
            echo "CARPEOS_SANDBOX_OUT=/tmp/product4-sandbox-out-${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"
      - name: Check out trusted evaluator base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          persist-credentials: false

      - name: Download raw evidence as data
        uses: actions/download-artifact@v7
        with:
          name: product4-raw-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/product4-raw
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check out C only into an isolated no-secret workspace
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Move C into an external candidate workspace
        run: |
          mkdir -p "$CARPEOS_CANDIDATE_ROOT"
          mv "$GITHUB_WORKSPACE/candidate" "$CARPEOS_CANDIDATE_ROOT"
          chmod -R a-w "$CARPEOS_CANDIDATE_ROOT"
          mkdir -p "$CARPEOS_HOME" "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_OUT"
          chmod 0777 "$CARPEOS_HOME" "$CARPEOS_SANDBOX_WORK" "$CARPEOS_SANDBOX_OUT"
      - name: Freeze trusted evaluator and raw inputs before candidate execution
        run: |
          chmod -R a-w "$GITHUB_WORKSPACE"
          chmod -R a-w "$RUNNER_TEMP/product4-raw"
      - name: Install the bubblewrap sandbox runtime
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi
      - name: Execute candidate build and CLI in a bounded bubblewrap sandbox
        run: |
          set -euo pipefail
          node_path="$(readlink -f "$(command -v node)")"
          node_dir="$(dirname "$node_path")"
          pnpm_command="$(command -v pnpm)"
          pnpm_path="$(readlink -f "$pnpm_command")"
          pnpm_bin_dir="$(dirname "$pnpm_command")"
          pnpm_dir="$(dirname "$(dirname "$pnpm_path")")"
          pnpm_store="$(pnpm store path --silent)"
          test -x "$node_path"
          test -x "$pnpm_path"
          test -d "$pnpm_store"
          test -n "$(find "$pnpm_store" -mindepth 1 -print -quit)"
          sandbox=(
            sudo
            -n
            bwrap
            --die-with-parent
            --new-session
            --unshare-all
            --unshare-net
            --clearenv
            --ro-bind "$CARPEOS_CANDIDATE_ROOT" /candidate
            --bind "$CARPEOS_SANDBOX_WORK" /work
            --bind "$CARPEOS_HOME" /home
            --bind "$CARPEOS_SANDBOX_OUT" /output
            --tmpfs /tmp
            --proc /proc
            --dev /dev
            --dir /run
            --chdir /work
            --setenv HOME /home
            --setenv CARPEOS_HOME /home
            --setenv CARPEOS_TRUST_ZONE tz_synthetic
            --setenv NODE_NO_WARNINGS 1
            --setenv NO_COLOR 1
            --setenv TZ UTC
            --setenv PATH "$node_dir:$pnpm_bin_dir:/usr/local/bin:/usr/bin:/bin"
            --cap-drop ALL
            --ro-bind /usr /usr
            --ro-bind /bin /bin
            --ro-bind /lib /lib
            --ro-bind /lib64 /lib64
            --ro-bind /etc /etc
            --ro-bind "$node_dir" "$node_dir"
            --ro-bind "$pnpm_dir" "$pnpm_dir"
            --ro-bind "$pnpm_bin_dir" "$pnpm_bin_dir"
            --ro-bind "$pnpm_store" /pnpm-store
            --
            setpriv
            --no-new-privs
            --inh-caps=-all
            --ambient-caps=-all
            --
          )
          # rlimits must be set inside the namespace (after setpriv). Host ulimit
          # before sudo bwrap is reset by sudo and is not observed by the probe.
          "${sandbox[@]}" /bin/bash -ceu '
            ulimit -u 64
            ulimit -v 1048576
            ulimit -f 102400
            rm -rf /work/*
            cp -aL /candidate/. /work/
            chmod -R u+rwX /work
            cd /work
            pnpm install --offline --frozen-store --frozen-lockfile --ignore-scripts --store-dir /pnpm-store
            pnpm --filter "@carpeos/cli..." build
            node apps/carpeos-cli/dist/index.js init --home /home --trust-zone tz_synthetic
            node /work/scripts/product4/sandbox-probe.mjs /output/sandbox-probe.json
          '
          sudo -n chmod -R a-w "$CARPEOS_SANDBOX_WORK"
      - name: Emit trusted sandbox receipt
        run: |
          set -euo pipefail
          tree_sha256="$(node "$GITHUB_WORKSPACE/scripts/product4/tree-digest.mjs" "$CARPEOS_CANDIDATE_ROOT" HEAD)"
          export RECEIPT_PATH="$CARPEOS_SANDBOX_OUT/sandbox-receipt.json"
          export HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          export BASE_SHA="$PRODUCT4_BASE_SHA"
          export TREE_SHA256="$tree_sha256"
          export PROBE_PATH="$CARPEOS_SANDBOX_OUT/sandbox-probe.json"
          export CANDIDATE_ROOT="$CARPEOS_CANDIDATE_ROOT"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import {
            assertSandboxProbeObservation,
            buildP02SandboxReceipt,
            sandboxProbeDigest,
          } from "./scripts/product4/p02-runner.mjs";
          const probe = assertSandboxProbeObservation(
            JSON.parse(readFileSync(process.env.PROBE_PATH, "utf8")),
          );
          const receipt = buildP02SandboxReceipt({
            candidateRoot: process.env.CANDIDATE_ROOT,
            headSha: process.env.HEAD_SHA,
            baseSha: process.env.BASE_SHA,
            treeSha256: process.env.TREE_SHA256,
            probe,
            probeSha256: sandboxProbeDigest(probe),
          });
          writeFileSync(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o400,
          });
          NODE
          sudo -n chmod -R a-w "$CARPEOS_SANDBOX_OUT"
      - name: Recompute C-bound semantics from the trusted base
        run: |
          rm -rf "$RUNNER_TEMP/product4-attestation-out"
          mkdir -m 700 "$RUNNER_TEMP/product4-attestation-out"
          tree_sha256="$(node "$GITHUB_WORKSPACE/scripts/product4/tree-digest.mjs" "$CARPEOS_CANDIDATE_ROOT" HEAD)"
          NODE_NO_WARNINGS=1 node "$GITHUB_WORKSPACE/scripts/product4/evaluator-runner.mjs" \
            --raw-report "$RUNNER_TEMP/product4-raw/raw-report.json" \
            --candidate-root "$CARPEOS_CANDIDATE_ROOT" \
            --workspace-root "$CARPEOS_SANDBOX_WORK" \
            --cli-root "$CARPEOS_SANDBOX_WORK" \
            --home "$CARPEOS_HOME" \
            --sandbox-receipt "$CARPEOS_SANDBOX_OUT/sandbox-receipt.json" \
            --head-sha "${{ github.event.workflow_run.head_sha }}" \
            --base-sha "$PRODUCT4_BASE_SHA" \
            --tree-sha256 "$tree_sha256" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --output "$RUNNER_TEMP/product4-attestation-out/attestation.json"

      - name: Upload strict attestation data
        uses: actions/upload-artifact@v6
        with:
          name: product4-attestation
          path: ${{ runner.temp }}/product4-attestation-out/attestation.json
          if-no-files-found: error
          retention-days: 7
