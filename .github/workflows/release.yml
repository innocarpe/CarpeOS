name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  release-gate:
    name: Verify Product 4 release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js without registry credentials
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies without registry credentials
        run: pnpm install --frozen-lockfile

      - name: Run checks before release authority
        run: pnpm check

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./packages/carpeos/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match packages/carpeos version $VERSION"
            exit 1
          fi

      - name: Build npm package
        run: pnpm --filter @innocarpe/carpeos build

      - name: Pack approved release artifact once
        id: artifact
        run: |
          node scripts/pack-once.mjs pack \
            --sha "$GITHUB_SHA" \
            --tag "${{ steps.pkg.outputs.tag }}" \
            --version "${{ steps.pkg.outputs.version }}" \
            --out-dir .release-artifact
          echo "manifest=$GITHUB_WORKSPACE/.release-artifact/release-artifact.json" >> "$GITHUB_OUTPUT"
          echo "tarball=$GITHUB_WORKSPACE/.release-artifact/$(node -p "require('./.release-artifact/release-artifact.json').filename")" >> "$GITHUB_OUTPUT"

      - name: Install and smoke the exact packed artifact before release authority
        env:
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          PACKAGE_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          node scripts/pack-once.mjs assert-artifact --manifest "$MANIFEST" --tarball "$TARBALL"
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/carpeos-release-smoke.XXXXXX")"
          cleanup() {
            rm -rf -- "$SMOKE_ROOT"
          }
          trap cleanup EXIT
          trap 'exit 1' HUP INT TERM
          export HOME="$SMOKE_ROOT/home"
          export CARPEOS_HOME="$HOME"
          export npm_config_cache="$SMOKE_ROOT/npm-cache"
          mkdir -p "$HOME" "$npm_config_cache"
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm install --prefix "$SMOKE_ROOT/install" "$TARBALL"
          CLI="$SMOKE_ROOT/install/node_modules/.bin/carpeos"
          test -x "$CLI"
          VERSION_JSON="$("$CLI" --version)"
          INSTALLED_VERSION="$(VERSION_JSON="$VERSION_JSON" node -e 'const value = JSON.parse(process.env.VERSION_JSON); if (value.ok !== true || value.name !== "@innocarpe/carpeos" || typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          test "$INSTALLED_VERSION" = "$PACKAGE_VERSION"
          "$CLI" setup run --apply --home "$CARPEOS_HOME"
          "$CLI" setup doctor --home "$CARPEOS_HOME"
          node scripts/smoke-dogfood.mjs --cli "$CLI"

      - name: Verify Product 4 release gates before registry configuration
        env:
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          node scripts/verify-4.0-gates.mjs \
            --receipt-dir artifacts/receipts \
            --manifest "$MANIFEST" \
            --tarball "$TARBALL" \
            --tag "$GITHUB_REF_NAME" \
            --release-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/product4-release-gate.json"

      - name: Preserve the exact gated artifact
        uses: actions/upload-artifact@v4
        with:
          name: product4-release-artifact
          path: .release-artifact
          if-no-files-found: error

  publish:
    name: Publish npm + GitHub Release
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the exact gated artifact
        uses: actions/download-artifact@v4
        with:
          name: product4-release-artifact
          path: .release-artifact

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js with registry configuration after release gate
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./packages/carpeos/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match packages/carpeos version $VERSION"
            exit 1
          fi

      - name: Verify the exact gated artifact before publish
        id: artifact
        run: |
          MANIFEST="$GITHUB_WORKSPACE/.release-artifact/release-artifact.json"
          TARBALL="$GITHUB_WORKSPACE/.release-artifact/$(node -p "require('./.release-artifact/release-artifact.json').filename")"
          node scripts/pack-once.mjs assert-artifact --manifest "$MANIFEST" --tarball "$TARBALL"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish packed artifact to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          node scripts/pack-once.mjs assert-artifact --manifest "$MANIFEST" --tarball "$TARBALL"
          npm publish "$TARBALL" --access public --provenance

      - name: Verify published registry artifact
        env:
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
        run: node scripts/pack-once.mjs verify-registry --manifest "$MANIFEST"

      - name: Extract changelog section
        id: notes
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const version = process.env.VERSION;
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const header = `## [${version}]`;
          const start = changelog.indexOf(header);
          if (start === -1) {
            writeFileSync("release-notes.md", `Release v${version}\n`);
            process.exit(0);
          }
          const after = changelog.slice(start);
          const next = after.search(/\n## \[/);
          const section = (next === -1 ? after : after.slice(0, next)).trim() + "\n";
          writeFileSync("release-notes.md", section);
          NODE
        env:
          VERSION: ${{ steps.pkg.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "@innocarpe/carpeos v${{ steps.pkg.outputs.version }}"
          body_path: release-notes.md
          generate_release_notes: false
