name: Setup Node + pnpm
description: Install Node 22, pnpm 11, and frozen lockfile dependencies (cached store).

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.16.0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22.22.0
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
